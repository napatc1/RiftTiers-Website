<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiftTiers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <header>
    <div class="header-top">
      <h1 class="site-title">
        <svg class="site-logo" viewBox="0 0 200 200" width="28" height="28" aria-hidden="true">
          <polygon points="100,16 86,54 112,80 78,112 116,142 100,184 18,100" fill="#2f7fd6"/>
          <polygon points="100,16 182,100 100,184 116,142 78,112 112,80 86,54" fill="#6cc3ff"/>
        </svg>
        Rift<span class="title-accent">Tiers</span>
      </h1>
      <div class="header-top-right">
        <div id="auth-widget" class="auth-widget"></div>
        <a href="https://discord.gg/PD2U3ssy9" target="_blank" rel="noopener" class="discord-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.001-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span>Discord</span>
        </a>
      </div>
    </div>
    <div class="page-tabs" id="page-tabs">
      <button type="button" class="page-tab active" data-page="home">Home</button>
      <button type="button" class="page-tab" data-page="leaderboard">Leaderboard</button>
      <button type="button" class="page-tab" data-page="testers">Testers</button>
      <button type="button" class="page-tab" data-page="testing">Testing</button>
      <button type="button" class="page-tab" data-page="support">Support</button>
      <button type="button" class="page-tab" data-page="verify" id="verify-tab-btn" style="display:none">Verify</button>
    </div>
    <nav id="filter-nav">
      <div id="nav-tabs"></div>
      <div class="custom-select" id="region-dropdown">
        <button type="button" class="custom-select-trigger" id="region-trigger">
          Region <span class="custom-select-arrow"></span>
        </button>
        <div class="custom-select-menu custom-select-menu-checkbox" id="region-menu"></div>
      </div>
      <div class="custom-select" id="tier-dropdown">
        <button type="button" class="custom-select-trigger" id="tier-trigger">
          Tier <span class="custom-select-arrow"></span>
        </button>
        <div class="custom-select-menu custom-select-menu-checkbox" id="tier-menu"></div>
      </div>
      <div class="custom-select" id="gamemode-dropdown">
        <button type="button" class="custom-select-trigger" id="gamemode-trigger">
          Gamemode <span class="custom-select-arrow"></span>
        </button>
        <div class="custom-select-menu" id="gamemode-menu"></div>
      </div>
      <input type="text" id="search-input" placeholder="Search player..." />
    </nav>
  </header>

  <main>
    <h2 id="view-title">Overall Rankings</h2>
    <div id="leaderboard"></div>
  </main>

  <button type="button" id="side-panel-tab" class="side-panel-tab">Tests</button>
  <div id="side-panel" class="side-panel">
    <button type="button" id="side-panel-close" class="side-panel-close">&times;</button>
    <div id="live-now-widget" class="live-now-widget"></div>
    <div id="recent-tests-widget" class="live-now-widget recent-tests-widget"></div>
  </div>

  <script src="js/tiers.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/testing.js"></script>
  <script src="js/support.js"></script>
  <script src="js/verify.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
