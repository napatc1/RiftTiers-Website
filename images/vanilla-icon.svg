<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Fist / bare-hand combat icon -->
  <!-- Fingers -->
  <rect x="8"  y="6"  width="4" height="8" fill="#e8c49a"/>
  <rect x="12" y="4"  width="4" height="10" fill="#e8c49a"/>
  <rect x="16" y="4"  width="4" height="10" fill="#e8c49a"/>
  <rect x="20" y="6"  width="4" height="8"  fill="#e8c49a"/>
  <!-- Finger knuckle lines -->
  <rect x="8"  y="8"  width="4" height="2" fill="#c8a07a"/>
  <rect x="12" y="8"  width="4" height="2" fill="#c8a07a"/>
  <rect x="16" y="8"  width="4" height="2" fill="#c8a07a"/>
  <rect x="20" y="8"  width="4" height="2" fill="#c8a07a"/>
  <!-- Palm top row -->
  <rect x="6"  y="14" width="20" height="2" fill="#e8c49a"/>
  <!-- Palm -->
  <rect x="4"  y="16" width="22" height="8" fill="#e8c49a"/>
  <rect x="6"  y="24" width="20" height="2" fill="#d8b48a"/>
  <!-- Thumb -->
  <rect x="2"  y="14" width="4" height="6" fill="#e8c49a"/>
  <rect x="2"  y="16" width="4" height="2" fill="#c8a07a"/>
  <!-- Palm highlight -->
  <rect x="8"  y="17" width="6" height="4" fill="#f4d4aa"/>
  <!-- Wrist -->
  <rect x="8"  y="26" width="16" height="4" fill="#d8b48a"/>
</svg>
