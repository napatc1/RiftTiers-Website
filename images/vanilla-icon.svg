<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- End Crystal (cPvP) -->
  <!-- Fire on top -->
  <rect x="14" y="0"  width="4" height="2" fill="#ff8800"/>
  <rect x="12" y="2"  width="8" height="2" fill="#ffaa00"/>
  <rect x="14" y="4"  width="4" height="2" fill="#ff6600"/>
  <!-- Crystal top face -->
  <rect x="10" y="6"  width="12" height="2" fill="#dd88ff"/>
  <rect x="8"  y="8"  width="16" height="2" fill="#cc66ff"/>
  <!-- Crystal body sides -->
  <rect x="6"  y="10" width="20" height="2" fill="#aa44dd"/>
  <rect x="6"  y="12" width="20" height="2" fill="#bb55ee"/>
  <rect x="6"  y="14" width="20" height="2" fill="#aa44dd"/>
  <rect x="6"  y="16" width="20" height="2" fill="#993acc"/>
  <!-- Crystal bottom taper -->
  <rect x="8"  y="18" width="16" height="2" fill="#882abb"/>
  <rect x="10" y="20" width="12" height="2" fill="#7722aa"/>
  <rect x="12" y="22" width="8"  height="2" fill="#661599"/>
  <rect x="14" y="24" width="4"  height="2" fill="#550088"/>
  <!-- Crystal shine -->
  <rect x="8"  y="10" width="4" height="4" fill="#eeb8ff"/>
  <rect x="10" y="10" width="2" height="6" fill="#ffffff" opacity="0.6"/>
  <!-- Glow highlights on edges -->
  <rect x="4"  y="10" width="2" height="8" fill="#cc66ff" opacity="0.5"/>
  <rect x="26" y="10" width="2" height="8" fill="#882abb" opacity="0.5"/>
  <!-- Obsidian base -->
  <rect x="8"  y="26" width="16" height="6" fill="#1a1a2e"/>
  <rect x="8"  y="26" width="16" height="2" fill="#2a2a3e"/>
  <rect x="8"  y="26" width="2"  height="6" fill="#2a2a3e"/>
</svg>
