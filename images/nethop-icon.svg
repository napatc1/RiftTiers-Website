<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Netherite sword -->
  <!-- Blade -->
  <rect x="18" y="2"  width="4" height="4" fill="#888888"/>
  <rect x="16" y="4"  width="4" height="4" fill="#777777"/>
  <rect x="14" y="6"  width="4" height="4" fill="#888888"/>
  <rect x="12" y="8"  width="4" height="4" fill="#777777"/>
  <rect x="10" y="10" width="4" height="4" fill="#888888"/>
  <rect x="8"  y="12" width="4" height="4" fill="#777777"/>
  <rect x="6"  y="14" width="4" height="4" fill="#888888"/>
  <!-- Blade highlight -->
  <rect x="20" y="2"  width="2" height="2" fill="#bbbbbb"/>
  <rect x="18" y="4"  width="2" height="2" fill="#aaaaaa"/>
  <rect x="16" y="6"  width="2" height="2" fill="#bbbbbb"/>
  <!-- Nether glow effect on blade -->
  <rect x="18" y="2"  width="2" height="2" fill="#ff6600" opacity="0.3"/>
  <rect x="14" y="6"  width="2" height="2" fill="#ff6600" opacity="0.2"/>
  <!-- Guard (dark netherite) -->
  <rect x="4"  y="16" width="16" height="4" fill="#333333"/>
  <rect x="6"  y="16" width="12" height="2" fill="#555555"/>
  <!-- Handle -->
  <rect x="8"  y="20" width="4" height="4" fill="#2a2a2a"/>
  <rect x="8"  y="24" width="4" height="4" fill="#333333"/>
  <!-- Pommel -->
  <rect x="6"  y="26" width="8" height="4" fill="#3a3a3a"/>
  <!-- Nether fire particles -->
  <rect x="24" y="4"  width="2" height="2" fill="#ff8800"/>
  <rect x="26" y="8"  width="2" height="2" fill="#ff6600"/>
  <rect x="2"  y="18" width="2" height="2" fill="#ff4400"/>
</svg>
