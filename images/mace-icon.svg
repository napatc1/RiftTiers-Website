<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Mace (heavy weapon) -->
  <!-- Head top -->
  <rect x="8"  y="2"  width="16" height="2" fill="#888888"/>
  <!-- Head body (chunky) -->
  <rect x="6"  y="4"  width="20" height="2" fill="#999999"/>
  <rect x="4"  y="6"  width="24" height="2" fill="#888888"/>
  <rect x="4"  y="8"  width="24" height="2" fill="#aaaaaa"/>
  <rect x="4"  y="10" width="24" height="2" fill="#999999"/>
  <rect x="4"  y="12" width="24" height="2" fill="#888888"/>
  <rect x="6"  y="14" width="20" height="2" fill="#777777"/>
  <rect x="8"  y="16" width="16" height="2" fill="#888888"/>
  <!-- Head spikes -->
  <rect x="2"  y="6"  width="2" height="4" fill="#bbbbbb"/>
  <rect x="28" y="6"  width="2" height="4" fill="#bbbbbb"/>
  <rect x="2"  y="10" width="2" height="4" fill="#aaaaaa"/>
  <rect x="28" y="10" width="2" height="4" fill="#aaaaaa"/>
  <!-- Top spikes -->
  <rect x="10" y="0"  width="4" height="4" fill="#aaaaaa"/>
  <rect x="18" y="0"  width="4" height="4" fill="#aaaaaa"/>
  <!-- Head highlight -->
  <rect x="6"  y="6"  width="4" height="4" fill="#cccccc"/>
  <!-- Handle -->
  <rect x="13" y="18" width="6" height="4" fill="#7a5234"/>
  <rect x="13" y="22" width="6" height="4" fill="#8b5e3c"/>
  <rect x="13" y="26" width="6" height="4" fill="#7a5234"/>
  <!-- Pommel -->
  <rect x="11" y="28" width="10" height="4" fill="#9e6a42"/>
</svg>
