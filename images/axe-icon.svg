<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Axe head top face -->
  <rect x="14" y="2"  width="14" height="2" fill="#5de0ff"/>
  <rect x="12" y="4"  width="16" height="2" fill="#3acef0"/>
  <rect x="10" y="6"  width="16" height="2" fill="#20b8e0"/>
  <rect x="8"  y="8"  width="16" height="2" fill="#3acef0"/>
  <rect x="8"  y="10" width="14" height="2" fill="#20b8e0"/>
  <!-- Axe head side/bottom -->
  <rect x="6"  y="8"  width="4"  height="8" fill="#1898c0"/>
  <rect x="8"  y="12" width="6"  height="4" fill="#20b8e0"/>
  <!-- Bit (cutting edge) -->
  <rect x="22" y="4"  width="4" height="12" fill="#80eaff"/>
  <rect x="24" y="6"  width="4" height="8"  fill="#a8f2ff"/>
  <!-- Handle socket -->
  <rect x="10" y="12" width="4" height="4" fill="#1070a0"/>
  <!-- Handle -->
  <rect x="12" y="16" width="4" height="4" fill="#8b5e3c"/>
  <rect x="12" y="20" width="4" height="4" fill="#7a5234"/>
  <rect x="12" y="24" width="4" height="4" fill="#8b5e3c"/>
  <rect x="12" y="28" width="4" height="2" fill="#7a5234"/>
</svg>
