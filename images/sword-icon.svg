<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Blade (diagonal, pixel art style) -->
  <rect x="18" y="2"  width="4" height="4" fill="#e8f4ff"/>
  <rect x="16" y="4"  width="4" height="4" fill="#c8dff5"/>
  <rect x="14" y="6"  width="4" height="4" fill="#a8c8e8"/>
  <rect x="12" y="8"  width="4" height="4" fill="#c8dff5"/>
  <rect x="10" y="10" width="4" height="4" fill="#a8c8e8"/>
  <rect x="8"  y="12" width="4" height="4" fill="#88b0d8"/>
  <rect x="6"  y="14" width="4" height="4" fill="#a8c8e8"/>
  <!-- Highlight -->
  <rect x="20" y="2"  width="2" height="2" fill="#ffffff"/>
  <rect x="18" y="4"  width="2" height="2" fill="#e8f4ff"/>
  <!-- Guard -->
  <rect x="6"  y="16" width="12" height="4" fill="#d4a820"/>
  <rect x="4"  y="16" width="4"  height="4" fill="#b88c10"/>
  <rect x="8"  y="16" width="8"  height="2" fill="#f0c840"/>
  <!-- Handle -->
  <rect x="8"  y="20" width="4" height="4" fill="#8b5e3c"/>
  <rect x="8"  y="24" width="4" height="4" fill="#7a5234"/>
  <!-- Pommel -->
  <rect x="6"  y="26" width="8" height="4" fill="#9e6a42"/>
  <rect x="8"  y="28" width="4" height="2" fill="#b87c50"/>
</svg>
