<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Splash potion bottle -->
  <!-- Cork / top -->
  <rect x="12" y="2"  width="8"  height="2" fill="#c8a040"/>
  <rect x="10" y="4"  width="12" height="2" fill="#d4b048"/>
  <!-- Neck -->
  <rect x="12" y="6"  width="8"  height="4" fill="#888888"/>
  <rect x="14" y="6"  width="4"  height="4" fill="#aaaaaa"/>
  <!-- Body outline -->
  <rect x="6"  y="10" width="20" height="2" fill="#cc3333"/>
  <rect x="4"  y="12" width="24" height="2" fill="#cc3333"/>
  <rect x="4"  y="22" width="24" height="2" fill="#cc3333"/>
  <rect x="6"  y="24" width="20" height="2" fill="#cc3333"/>
  <rect x="4"  y="12" width="2"  height="10" fill="#cc3333"/>
  <rect x="26" y="12" width="2"  height="10" fill="#cc3333"/>
  <!-- Body fill -->
  <rect x="6"  y="12" width="20" height="10" fill="#ee4444"/>
  <!-- Shine -->
  <rect x="8"  y="13" width="4"  height="6" fill="#ff8888"/>
  <rect x="9"  y="14" width="2"  height="4" fill="#ffaaaa"/>
