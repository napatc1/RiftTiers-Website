  <rect x="10" y="28" width="12" height="2" fill="#aa2020"/>
  <!-- Splash drops -->
  <rect x="2"  y="20" width="2"  height="2" fill="#ee4444"/>
  <rect x="28" y="18" width="2"  height="2" fill="#ee4444"/>
  <rect x="4"  y="26" width="2"  height="2" fill="#cc3333"/>
  <rect x="26" y="26" width="2"  height="2" fill="#cc3333"/>
</svg>
