  <rect x="16" y="24" width="4" height="2" fill="#7a4e28"/>
  <rect x="24" y="22" width="4" height="2" fill="#7a4e28"/>
  <!-- Side highlight (3D feel) -->
  <rect x="2"  y="14" width="2" height="16" fill="#b07840"/>
  <rect x="28" y="14" width="2" height="16" fill="#7a4e28"/>
