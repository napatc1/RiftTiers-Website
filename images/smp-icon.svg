  <rect x="2"  y="2"  width="28" height="10" fill="#5dab22"/>
  <!-- Grass top texture -->
  <rect x="2"  y="2"  width="2" height="2" fill="#78c836"/>
  <rect x="6"  y="2"  width="4" height="2" fill="#78c836"/>
  <rect x="12" y="2"  width="2" height="2" fill="#48981a"/>
  <rect x="16" y="2"  width="4" height="2" fill="#78c836"/>
  <rect x="22" y="2"  width="2" height="2" fill="#48981a"/>
  <rect x="26" y="2"  width="4" height="2" fill="#78c836"/>
  <rect x="4"  y="4"  width="2" height="2" fill="#48981a"/>
  <rect x="10" y="4"  width="4" height="2" fill="#78c836"/>
  <rect x="18" y="4"  width="2" height="2" fill="#48981a"/>
  <rect x="24" y="4"  width="4" height="2" fill="#78c836"/>
