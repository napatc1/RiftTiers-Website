<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Minecart -->
  <!-- Cart body top -->
  <rect x="4"  y="8"  width="24" height="2" fill="#888888"/>
  <!-- Cart sides -->
  <rect x="2"  y="10" width="4"  height="10" fill="#999999"/>
  <rect x="26" y="10" width="4"  height="10" fill="#777777"/>
  <!-- Cart front/back inner walls -->
  <rect x="4"  y="10" width="2"  height="10" fill="#aaaaaa"/>
  <rect x="26" y="10" width="2"  height="10" fill="#666666"/>
  <!-- Cart floor -->
  <rect x="4"  y="18" width="24" height="2" fill="#777777"/>
  <!-- Cart interior -->
  <rect x="6"  y="10" width="20" height="8" fill="#555555"/>
  <!-- Interior highlight -->
  <rect x="8"  y="11" width="6"  height="2" fill="#666666"/>
  <!-- Cart bottom bar -->
  <rect x="2"  y="20" width="28" height="2" fill="#666666"/>
  <!-- Wheels -->
  <!-- Left wheel -->
  <rect x="4"  y="22" width="8" height="8" fill="#444444"/>
  <rect x="6"  y="24" width="4" height="4" fill="#222222"/>
  <rect x="6"  y="22" width="4" height="2" fill="#555555"/>
  <rect x="4"  y="24" width="2" height="4" fill="#555555"/>
  <rect x="10" y="24" width="2" height="4" fill="#333333"/>
  <rect x="6"  y="28" width="4" height="2" fill="#333333"/>
  <!-- Right wheel -->
  <rect x="20" y="22" width="8" height="8" fill="#444444"/>
  <rect x="22" y="24" width="4" height="4" fill="#222222"/>
  <rect x="22" y="22" width="4" height="2" fill="#555555"/>
  <rect x="20" y="24" width="2" height="4" fill="#555555"/>
  <rect x="26" y="24" width="2" height="4" fill="#333333"/>
  <rect x="22" y="28" width="4" height="2" fill="#333333"/>
  <!-- Rail -->
  <rect x="0"  y="28" width="32" height="2" fill="#888888"/>
  <rect x="2"  y="30" width="4"  height="2" fill="#666666"/>
  <rect x="10" y="30" width="4"  height="2" fill="#666666"/>
  <rect x="18" y="30" width="4"  height="2" fill="#666666"/>
  <rect x="26" y="30" width="4"  height="2" fill="#666666"/>
</svg>
