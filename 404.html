<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RyftTiers</title>
  <script>
    // Single Page Apps for Cloudflare Pages: a direct hit on a path
    // like /Testing 404s here. This bounces it to index.html with the
    // intended path packed into the query string, and the inline script
    // in index.html's <head> unpacks it before the app runs, so the
    // address bar ends up correct with no visible redirect.
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
      l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
